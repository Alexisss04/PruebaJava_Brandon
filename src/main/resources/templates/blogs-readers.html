<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Readers por Blog - EMPRESA XYZ</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .header { background-color: #333; color: white; padding: 15px 20px; }
        .container { display: flex; min-height: 85vh; }
        .sidebar { width: 220px; background-color: #f4f4f4; padding: 20px; border-right: 1px solid #ccc; }
        .sidebar h3 { margin-top: 0; font-size: 16px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        .sidebar ul { list-style-type: none; padding: 0; }
        .sidebar li { margin-bottom: 12px; }
        .sidebar a { text-decoration: none; color: #0066cc; font-weight: bold; }
        .sidebar a:hover { text-decoration: underline; }
        .content { flex: 1; padding: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #e9e9e9; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        select { width: 100%; padding: 6px; box-sizing: border-box; }
        .btn { padding: 6px 12px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
<div class="header">
    <h2 style="margin: 0;">EMPRESA XYZ</h2>
</div>
<div class="container">
    <div class="sidebar">
        <h3>Menú principal</h3>
        <ul>
            <li><a th:href="@{/readers}">Readers</a></li>
            <li><a th:href="@{/blogs}">Blogs</a></li>
            <li><a th:href="@{/blogs-readers}">Readers por blog</a></li>
        </ul>
    </div>
    <div class="content">
        <h2>Asignación de Readers por Blog</h2>

        <form th:action="@{/blogs-readers/save}" method="post" style="max-width: 500px; background: #fafafa; padding: 15px; border: 1px solid #ccc;">
            <div class="form-group">
                <label>Seleccione el Blog:</label>
                <select name="blogId" required>
                    <option value="">-- Seleccione un Blog --</option>
                    <option th:each="b : ${blogs}" th:value="${b.id}" th:text="${b.title}"></option>
                </select>
            </div>
            <div class="form-group">
                <label>Seleccione los Readers (Lista múltiple - Mantener Ctrl presionado):</label>
                <select name="readerIds" multiple style="height: 120px;">
                    <option th:each="r : ${allReaders}" th:value="${r.id}" th:text="${r.name}"></option>
                </select>
            </div>
            <button type="submit" class="btn">Guardar Asociación</button>
        </form>

        <h3 style="margin-top: 30px;">Resumen de Lectores por Blog</h3>
        <table>
            <thead>
            <tr>
                <th>Blog</th>
                <th>Readers Visitantes</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="b : ${blogs}">
                <td th:text="${b.title}"></td>
                <td>
                    <ul>
                        <li th:each="r : ${b.readers}" th:text="${r.name}"></li>
                    </ul>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
